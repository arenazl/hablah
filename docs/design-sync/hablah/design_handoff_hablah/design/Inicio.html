<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>habláh — inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
<style>
html,body{height:100%}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);height:100vh;overflow:hidden}
.shell aside{background:#0E1614;color:rgba(232,236,234,.8);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 18px 6px;display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:18px}
.brand-name{color:#fff;font-weight:800;font-size:16px}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,236,234,.45);margin-top:2px}
.nav2{padding:8px 12px;display:flex;flex-direction:column;gap:1px}
.nav2 .grp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,236,234,.4);padding:15px 12px 6px}
.nav2 a{display:flex;align-items:center;gap:11px;padding:8px 12px 8px 14px;border-radius:9px;font-size:13.5px;color:rgba(232,236,234,.72);position:relative;text-decoration:none;transition:background .14s var(--ease),color .14s var(--ease)}
.nav2 a svg{width:17px;height:17px;flex-shrink:0}
.nav2 a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav2 a.on{background:rgba(0,179,126,.14);color:#fff;font-weight:600}
.nav2 a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:99px;background:var(--green)}
.nav2 a .n{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.05em;color:rgba(232,236,234,.42);text-transform:uppercase}
.sideft{margin-top:auto;padding:12px}
.sideft .card{background:rgba(255,255,255,.04);border-radius:12px;padding:11px 12px;font-size:11.5px;color:rgba(232,236,234,.6);line-height:1.45}
.sideft .card b{color:#fff;display:block;font-size:12.5px;margin-bottom:3px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-1)}
.tbar{display:flex;align-items:center;gap:14px;padding:13px 24px;background:var(--surface);border-bottom:1px solid var(--border-1)}
.tbar h1{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em}
.tbar .sub{font-size:12.5px;color:var(--fg-3);margin-top:1px}
.tbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbar .file{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-4);background:var(--bg-2);border-radius:7px;padding:4px 8px}
.frame-wrap{flex:1;min-height:0;position:relative}
.frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:var(--bg-1)}
.frame-wrap iframe[hidden]{display:none}
.ftr{display:flex;align-items:center;gap:12px;padding:9px 24px;background:var(--surface);border-top:1px solid var(--border-1);font-size:11.5px;color:var(--fg-4)}
.ftr .dot{width:4px;height:4px;border-radius:50%;background:var(--border-2)}
.ftr a{color:var(--green-700);font-weight:600;text-decoration:none}
.ftr a:hover{color:var(--green)}
.home{position:absolute;inset:0;overflow-y:auto;padding:30px 28px 40px}
.home[hidden]{display:none}
.home h2{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.home .lede{font-size:14px;color:var(--fg-3);max-width:62ch;margin:0 0 26px}
.home .gt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.home .gt::after{content:"";flex:1;height:1px;background:var(--border-1)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hc{background:var(--surface);border:1px solid var(--border-1);border-radius:14px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card);transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease)}
.hc:hover{transform:translateY(-2px);box-shadow:var(--shadow-float);border-color:var(--border-2)}
.hc .ic{width:34px;height:34px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;color:var(--fg-2)}
.hc .ic svg{width:17px;height:17px}
.hc.g .ic{background:rgba(0,179,126,.12);color:var(--green-700)}
.hc h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin:0;color:var(--fg-1)}
.hc p{font-size:12.5px;color:var(--fg-3);margin:0;line-height:1.5}
.hc .f{margin-top:2px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--fg-4)}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="brand-mark">h</div><div><div class="brand-name">habláh</div><div class="brand-sub">mapa de pantallas</div></div></div>
    <nav class="nav2" id="nav2"></nav>
    <div class="sideft"><div class="card"><b>Inicio</b>Esta es la puerta de entrada. Cada pantalla es un HTML propio; el menú, la topbar y el footer los aporta este integrador.</div></div>
  </aside>
  <div class="pane">
    <header class="tbar">
      <div><h1 id="tTitle">—</h1><div class="sub" id="tSub"></div></div>
      <div class="right"><span class="file" id="tFile"></span><a class="btn btn-soft btn-sm" id="tOpen" href="#" target="_blank">Abrir sola ↗</a></div>
    </header>
    <div class="frame-wrap"><iframe id="frame" title="pantalla"></iframe><div class="home" id="home" hidden></div></div>
    <footer class="ftr"><span>habláh</span><span class="dot"></span><span id="fNote"></span><span style="margin-left:auto"><a href="paquete/README.md">handoff</a></span></footer>
  </div>
</div>
<script>
const I={
 inicio:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 hoy:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',
 practicar:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
 charla:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 reporte:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/>',
 mapa:'<path d="m9 3-6 3v15l6-3 6 3 6-3V3l-6 3z"/><path d="M9 3v15M15 6v15"/>',
 historial:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 perfil:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 kids:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 14.5a5 5 0 0 0 7 0"/>',
 onboarding:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 landing:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20M7 14h7"/>',
 login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
 probador:'<path d="M12 3v18M4 8l8-5 8 5M4 16l8 5 8-5"/>',
 backoffice:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'
};
const SCREENS=[
 {k:'inicio',t:'Inicio',s:'Todas las pantallas del producto y del motor',f:'Inicio.html',home:true},
 {g:'Producto — alumno'},
 {k:'hoy',t:'Hoy',s:'La sesión del día, racha y misiones abiertas',f:'Hoy.html'},
 {k:'practicar',t:'Practicar',s:'Elección de tópico: copiloto, atajos, filtros, sorpresa y tema libre',f:'Practicar.html'},
 {k:'charla',t:'Charla',s:'La clase en vivo por voz',f:'Charla.html'},
 {k:'reporte',t:'Reporte',s:'Cierre de sesión: qué salió bien y qué queda abierto',f:'Reporte.html'},
 {k:'mapa',t:'Mapa de progreso',s:'Recorrido por niveles y misiones',f:'Mapa.html'},
 {k:'historial',t:'Historial',s:'Todas las sesiones con su resultado',f:'Historial.html'},
 {k:'perfil',t:'Perfil',s:'Intereses, tutor activo y preferencias',f:'Perfil.html'},
 {g:'Modo Kids'},
 {k:'kids',t:'Kids',s:'La misma app para 4 a 13: Habi, monedas y monstruos del idioma',f:'Kids.html'},
 {g:'Entrada'},
 {k:'landing',t:'Landing',s:'Sitio público',f:'Landing.html'},
 {k:'login',t:'Ingreso',s:'Login y registro',f:'Login.html'},
 {k:'onboarding',t:'Onboarding',s:'Primeros pasos: edad, nivel, intereses y tutor',f:'Onboarding.html'},
 {g:'Motor — equipo'},
 {k:'backoffice',t:'Backoffice',s:'Overview, probador de clases, catálogo del motor, auditoría y operación',f:'Backoffice.html',own:true}
];
const NOTES={practicar:'practicar.js · app.css',backoffice:'backoffice.css · backoffice.data.js · backoffice.views.js · probador.css',kids:'app.css'};
function cur(){return (location.hash||'#inicio').slice(1)}
function nav(){
 document.getElementById('nav2').innerHTML=SCREENS.map(s=>s.g
  ?`<div class="grp">${s.g}</div>`
  :`<a href="#${s.k}" class="${cur()===s.k?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[s.k]}</svg>${s.t}</a>`).join('');
}
function homeHTML(){
 let out='<h2>habláh — mapa de pantallas</h2><p class="lede">Una app de práctica de inglés por voz y el motor que compone cada clase. Elegí una pantalla del menú o entrá desde acá.</p>';
 let open=false;
 SCREENS.forEach(s=>{
  if(s.home)return;
  if(s.g){if(open)out+='</div>';out+=`<div class="gt">${s.g}</div><div class="cards">`;open=true;return}
  out+=`<a class="hc ${s.k==='probador'||s.k==='backoffice'?'':'g'}" href="#${s.k}"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[s.k]}</svg></div><h3>${s.t}</h3><p>${s.s}</p><span class="f">${s.f}</span></a>`;
 });
 if(open)out+='</div>';
 return out;
}
function render(){
 const s=SCREENS.find(x=>x.k===cur())||SCREENS[0];
 nav();
 document.getElementById('tTitle').textContent=s.t;
 document.getElementById('tSub').textContent=s.s;
 document.getElementById('tFile').textContent=s.f;
 document.getElementById('tOpen').href=s.f;
 document.getElementById('fNote').textContent=NOTES[s.k]||'';
 const fr=document.getElementById('frame'),hm=document.getElementById('home');
 if(s.home){fr.hidden=true;fr.removeAttribute('src');hm.hidden=false;hm.innerHTML=homeHTML();document.getElementById('tOpen').style.display='none';return}
 document.getElementById('tOpen').style.display='';
 hm.hidden=true;fr.hidden=false;
 const src=s.f+(s.own?'':'?embed=1');
 if(fr.getAttribute('src')!==src)fr.setAttribute('src',src);
}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
