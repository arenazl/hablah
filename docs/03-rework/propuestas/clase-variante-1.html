<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Habláh — Clase · Variante 1: Aura orgánica</title>
<style>
  :root {
    --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --bg: oklch(98.5% 0.004 145);
    --surface: oklch(99.2% 0.002 145);
    --surface-2: oklch(96% 0.008 145);
    --ink: oklch(18.3% 0.011 176);
    --ink-soft: oklch(42% 0.02 176);
    --ink-faint: oklch(62% 0.015 176);
    --border: oklch(88% 0.012 145);
    --primary: oklch(67.8% 0.146 163);
    --primary-dark: oklch(50% 0.11 163);
    --primary-soft: oklch(92% 0.05 163);
    --accent: oklch(78% 0.15 75);
    --accent-dark: oklch(52% 0.13 65);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-pill: 999px;
    --dur-slow: 6s;
    --dur-med: 420ms;
    --dur-fast: 180ms;
    --ease: cubic-bezier(.22,.85,.32,1);
  }
  :root[data-theme="dark"] {
    --bg: oklch(15% 0.018 176);
    --surface: oklch(19% 0.02 176);
    --surface-2: oklch(23% 0.022 176);
    --ink: oklch(96% 0.006 145);
    --ink-soft: oklch(80% 0.016 145);
    --ink-faint: oklch(58% 0.018 176);
    --border: oklch(30% 0.02 176);
    --primary: oklch(74% 0.15 163);
    --primary-dark: oklch(60% 0.13 163);
    --primary-soft: oklch(30% 0.05 163);
    --accent: oklch(80% 0.15 78);
    --accent-dark: oklch(70% 0.14 72);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(15% 0.018 176);
      --surface: oklch(19% 0.02 176);
      --surface-2: oklch(23% 0.022 176);
      --ink: oklch(96% 0.006 145);
      --ink-soft: oklch(80% 0.016 145);
      --ink-faint: oklch(58% 0.018 176);
      --border: oklch(30% 0.02 176);
      --primary: oklch(74% 0.15 163);
      --primary-dark: oklch(60% 0.13 163);
      --primary-soft: oklch(30% 0.05 163);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
    transition: background var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  }

  .demo-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 16px; font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 11px; letter-spacing: .04em; color: var(--ink-faint);
    border-bottom: 1px dashed var(--border);
    background: var(--surface-2);
    flex-wrap: wrap;
  }
  .demo-strip b { color: var(--ink-soft); }
  .demo-strip .ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
  .demo-btn {
    font-family: inherit; font-size: 11px; padding: 5px 10px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    cursor: pointer; transition: all var(--dur-fast) var(--ease);
  }
  .demo-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
  .demo-btn:hover { border-color: var(--primary); }

  .stage {
    min-height: calc(100vh - 40px);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    position: relative;
  }

  .top-row {
    width: 100%; max-width: 640px; display: flex; align-items: center; justify-content: space-between;
  }
  .topic-chip {
    display: flex; flex-direction: column; gap: 2px;
  }
  .topic-eyebrow {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .topic-title { font-family: var(--font-serif); font-size: 20px; font-weight: 500; letter-spacing: -.01em; color: var(--ink); }
  .topic-title em { font-style: italic; color: var(--primary-dark); }

  .exit-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    cursor: pointer; transition: all var(--dur-fast) var(--ease);
  }
  .exit-btn:hover { border-color: var(--ink-faint); color: var(--ink); background: var(--surface-2); }

  .aura-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }

  .aura-wrap { position: relative; width: 260px; height: 260px; display: grid; place-items: center; }
  .aura-halo {
    position: absolute; inset: -30px; border-radius: 50%;
    background: radial-gradient(circle, var(--primary-soft) 0%, transparent 68%);
    filter: blur(2px);
    animation: breathe var(--dur-slow) ease-in-out infinite;
  }
  .aura-ring {
    position: absolute; inset: 18px; border-radius: 50%;
    border: 1.5px solid var(--border);
  }
  .aura-ring::before {
    content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
    border: 1.5px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary);
    opacity: .55;
    animation: spin 14s linear infinite;
  }
  .aura-core {
    position: relative; width: 168px; height: 168px; border-radius: 50%;
    /* fallback simple (browsers sin soporte de oklch relative-color se quedan con esta) */
    background: radial-gradient(circle at 34% 30%, var(--primary) 0%, var(--primary) 55%, var(--primary-dark) 100%);
    background: radial-gradient(circle at 34% 30%, oklch(from var(--primary) calc(l + 0.12) c h) 0%, var(--primary) 55%, var(--primary-dark) 100%);
    box-shadow: 0 18px 48px -12px var(--primary-dark);
    box-shadow: 0 18px 48px -12px oklch(from var(--primary) l c h / 45%);
    animation: breathe-core var(--dur-slow) ease-in-out infinite;
    display: grid; place-items: center;
  }
  .aura-core::after {
    content: ""; position: absolute; inset: 14%; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, rgba(255,255,255,.35), transparent 60%);
  }

  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes breathe-core { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .aura-wrap[data-state="pensando"] .aura-core {
    background: radial-gradient(circle at 34% 30%, oklch(from var(--accent) calc(l + 0.1) c h) 0%, var(--accent) 55%, var(--accent-dark) 100%);
    animation-duration: 2.4s;
  }
  .aura-wrap[data-state="pensando"] .aura-halo { background: radial-gradient(circle, oklch(from var(--accent) l c h / 30%) 0%, transparent 68%); animation-duration: 2.4s; }
  .aura-wrap[data-state="hablando"] .aura-core { animation-duration: 1.1s; }
  .aura-wrap[data-state="hablando"] .aura-halo { animation-duration: 1.1s; }
  .aura-wrap[data-state="hablando"] .aura-ring::before { animation-duration: 4s; }

  .state-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: var(--ink-soft); font-weight: 500;
  }
  .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .aura-wrap[data-state="pensando"] ~ .state-label .state-dot { background: var(--accent-dark); }

  .prompt-line {
    max-width: 460px; text-align: center; font-family: var(--font-serif); font-style: italic;
    font-size: 17px; line-height: 1.5; color: var(--ink-soft); padding: 0 12px;
  }

  .bottom-row {
    width: 100%; max-width: 640px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .mic-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 26px; border-radius: var(--radius-pill);
    background: var(--ink); color: var(--bg); border: none;
    font-family: var(--font-sans); font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: transform var(--dur-fast) var(--ease);
  }
  .mic-btn:hover { transform: translateY(-1px); }
  .transcript-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: var(--radius-pill);
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft);
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--dur-fast) var(--ease);
  }
  .transcript-btn:hover { border-color: var(--ink-faint); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .aura-halo, .aura-core, .aura-ring::before { animation: none !important; }
  }
  @media (max-width: 480px) {
    .aura-wrap { width: 210px; height: 210px; }
    .aura-core { width: 136px; height: 136px; }
    .topic-title { font-size: 17px; }
  }
</style>
</head>
<body>

  <div class="demo-strip">
    <span><b>MAQUETA · Variante 1</b> — Aura orgánica / calma editorial. Estática, no requiere micrófono.</span>
    <div class="ctrls">
      <button class="demo-btn active" data-state-btn="escuchando">Escuchando</button>
      <button class="demo-btn" data-state-btn="pensando">Pensando</button>
      <button class="demo-btn" data-state-btn="hablando">Hablando</button>
      <button class="demo-btn" id="theme-toggle">Tema: claro</button>
    </div>
  </div>

  <div class="stage">
    <div class="top-row">
      <div class="topic-chip">
        <span class="topic-eyebrow">Hoy · con Coach</span>
        <span class="topic-title">Tu primer día en la <em>oficina</em></span>
      </div>
      <button class="exit-btn" aria-label="Salir de la clase" title="Salir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="aura-zone">
      <div class="aura-wrap" data-state="escuchando" id="aura">
        <div class="aura-halo"></div>
        <div class="aura-ring"></div>
        <div class="aura-core"></div>
      </div>
      <div class="state-label"><span class="state-dot"></span><span id="state-text">Te estoy escuchando</span></div>
      <p class="prompt-line" id="prompt-line">"Contame — ¿cómo te fue en tu primer día?"</p>
    </div>

    <div class="bottom-row">
      <button class="transcript-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Transcripción
      </button>
      <button class="mic-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        Mantené para hablar
      </button>
    </div>
  </div>

<script>
  var states = {
    escuchando: { text: 'Te estoy escuchando', prompt: '"Contame — ¿cómo te fue en tu primer día?"' },
    pensando:   { text: 'Pensando la respuesta', prompt: '…' },
    hablando:   { text: 'Hablando', prompt: '"Qué bueno que pudiste presentarte — contame algo más del equipo."' }
  };
  var aura = document.getElementById('aura');
  var stateText = document.getElementById('state-text');
  var promptLine = document.getElementById('prompt-line');
  document.querySelectorAll('[data-state-btn]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-state-btn]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var s = btn.getAttribute('data-state-btn');
      aura.setAttribute('data-state', s);
      stateText.textContent = states[s].text;
      promptLine.textContent = states[s].prompt;
    });
  });
  var themeBtn = document.getElementById('theme-toggle');
  themeBtn.addEventListener('click', function () {
    var root = document.documentElement;
    var isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeBtn.textContent = 'Tema: ' + (isDark ? 'claro' : 'oscuro');
  });
</script>
</body>
</html>
