<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Habláh — Clase · Variante 2: Estudio en vivo</title>
<style>
  :root {
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --bg: oklch(13.5% 0.016 200);
    --surface: oklch(18% 0.02 200);
    --surface-2: oklch(22% 0.022 200);
    --ink: oklch(95% 0.01 175);
    --ink-soft: oklch(74% 0.03 180);
    --ink-faint: oklch(50% 0.03 195);
    --border: oklch(30% 0.03 195);
    --primary: oklch(74% 0.15 172);
    --primary-glow: oklch(74% 0.15 172 / 45%);
    --primary-dim: oklch(45% 0.09 172);
    --accent: oklch(80% 0.16 78);
    --radius-pill: 999px;
    --dur-fast: 160ms;
    --ease: cubic-bezier(.22,.85,.32,1);
  }
  /* Piel clara: mismo sistema, estudio de dia (vidrio esmerilado en vez de negro) */
  :root[data-theme="light"] {
    --bg: oklch(95% 0.006 200);
    --surface: oklch(99% 0.003 200);
    --surface-2: oklch(92% 0.01 200);
    --ink: oklch(18% 0.02 200);
    --ink-soft: oklch(38% 0.03 195);
    --ink-faint: oklch(55% 0.02 195);
    --border: oklch(82% 0.015 195);
    --primary: oklch(56% 0.14 172);
    --primary-dim: oklch(70% 0.1 172);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-sans);
    min-height: 100vh; transition: background 300ms var(--ease), color 300ms var(--ease);
  }

  .demo-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em;
    color: var(--ink-faint); border-bottom: 1px dashed var(--border); background: var(--surface-2); flex-wrap: wrap;
  }
  .demo-strip b { color: var(--ink-soft); }
  .demo-strip .ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
  .demo-btn {
    font-family: var(--font-mono); font-size: 10.5px; padding: 5px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    cursor: pointer; transition: all var(--dur-fast) var(--ease); text-transform: uppercase; letter-spacing: .06em;
  }
  .demo-btn.active { background: var(--primary); border-color: var(--primary); color: var(--bg); }
  .demo-btn:hover { border-color: var(--primary); }

  .stage {
    min-height: calc(100vh - 40px);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 26px 20px calc(26px + env(safe-area-inset-bottom, 0px));
    position: relative;
    background:
      radial-gradient(1100px 500px at 50% -10%, oklch(74% 0.15 172 / 12%) 0%, transparent 60%),
      var(--bg);
  }

  .top-row { width: 100%; max-width: 680px; display: flex; align-items: center; justify-content: space-between; }
  .topic-chip { display: flex; flex-direction: column; gap: 3px; }
  .topic-eyebrow {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .topic-eyebrow::before { content: '// '; color: var(--primary); }
  .topic-title { font-family: var(--font-sans); font-size: 19px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }

  .rec-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--radius-pill);
    background: var(--surface-2); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); letter-spacing: .04em;
  }
  .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .exit-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    cursor: pointer; transition: all var(--dur-fast) var(--ease);
  }
  .exit-btn:hover { border-color: var(--ink-faint); color: var(--ink); background: var(--surface-2); }

  .aura-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }

  .bars-wrap { position: relative; width: 260px; height: 260px; display: grid; place-items: center; }
  .bars-ring { position: absolute; inset: 0; }
  .bar {
    position: absolute; left: 50%; top: 50%; width: 3px; height: 14px; border-radius: 2px;
    background: var(--primary-dim); transform-origin: 50% 0%;
    animation: bar-pulse 1.6s ease-in-out infinite;
  }
  @keyframes bar-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  .core {
    position: relative; width: 128px; height: 128px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--primary) 0%, var(--primary-dim) 60%, transparent 100%);
    box-shadow: 0 0 60px 6px var(--primary-glow), inset 0 0 30px oklch(0% 0 0 / 25%);
    display: grid; place-items: center;
    animation: core-breathe 3.2s ease-in-out infinite;
  }
  @keyframes core-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  .bars-wrap[data-state="pensando"] .bar { background: var(--accent); animation-duration: 2.6s; }
  .bars-wrap[data-state="pensando"] .core { background: radial-gradient(circle at 38% 32%, var(--accent) 0%, oklch(55% 0.1 78) 60%, transparent 100%); animation-duration: 2.6s; }
  .bars-wrap[data-state="hablando"] .bar { animation-duration: .55s; }
  .bars-wrap[data-state="hablando"] .core { animation-duration: 1s; }

  .state-label {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-mono);
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft);
  }
  .state-dot2 { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }

  .prompt-line {
    max-width: 460px; text-align: center; font-family: var(--font-sans); font-size: 16px;
    line-height: 1.5; color: var(--ink-soft); padding: 0 12px;
  }
  .prompt-line .caret { display: inline-block; width: 2px; height: 15px; background: var(--primary); vertical-align: -2px; margin-left: 2px; animation: blink .9s step-end infinite; }

  .bottom-row { width: 100%; max-width: 680px; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .mic-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 13px 24px; border-radius: 10px;
    background: var(--primary); color: var(--bg); border: none;
    font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    cursor: pointer; transition: transform var(--dur-fast) var(--ease);
  }
  .mic-btn:hover { transform: translateY(-1px); }
  .transcript-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft);
    font-family: var(--font-mono); font-size: 12px; cursor: pointer; transition: all var(--dur-fast) var(--ease);
  }
  .transcript-btn:hover { border-color: var(--primary); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .bar, .core, .rec-dot, .caret { animation: none !important; }
  }
  @media (max-width: 480px) {
    .bars-wrap { width: 210px; height: 210px; }
    .core { width: 100px; height: 100px; }
    .topic-title { font-size: 16px; }
  }
</style>
</head>
<body>

  <div class="demo-strip">
    <span><b>MAQUETA · Variante 2</b> — Estudio en vivo / waveform. Estática, no requiere micrófono.</span>
    <div class="ctrls">
      <button class="demo-btn active" data-state-btn="escuchando">Listening</button>
      <button class="demo-btn" data-state-btn="pensando">Thinking</button>
      <button class="demo-btn" data-state-btn="hablando">Speaking</button>
      <button class="demo-btn" id="theme-toggle">Tema: oscuro</button>
    </div>
  </div>

  <div class="stage">
    <div class="top-row">
      <div class="topic-chip">
        <span class="topic-eyebrow">sesión · Coach</span>
        <span class="topic-title">Tu primer día en la oficina</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="rec-pill"><span class="rec-dot"></span> 04:12</span>
        <button class="exit-btn" aria-label="Salir de la clase" title="Salir">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="aura-zone">
      <div class="bars-wrap" data-state="escuchando" id="aura">
        <div class="bars-ring" id="bars-ring"></div>
        <div class="core"></div>
      </div>
      <div class="state-label"><span class="state-dot2"></span><span id="state-text">Listening</span></div>
      <p class="prompt-line" id="prompt-line">"Contame — ¿cómo te fue en tu primer día?"<span class="caret"></span></p>
    </div>

    <div class="bottom-row">
      <button class="transcript-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        log
      </button>
      <button class="mic-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        Push to talk
      </button>
    </div>
  </div>

<script>
  // Genera 40 barras distribuidas en círculo, cada una con su radio/rotación y un delay
  // de animación distinto (para que el "waveform" no se vea sincronizado / robótico).
  var ring = document.getElementById('bars-ring');
  var N = 40, radius = 78;
  for (var i = 0; i < N; i++) {
    var deg = (360 / N) * i;
    var bar = document.createElement('i');
    bar.className = 'bar';
    var h = 10 + Math.round(Math.sin(i * 1.3) * 6 + 6);
    bar.style.height = h + 'px';
    bar.style.transform = 'translate(-50%, ' + (-radius) + 'px) rotate(' + deg + 'deg)';
    bar.style.transformOrigin = '50% ' + radius + 'px';
    bar.style.animationDelay = (i * 0.045) + 's';
    ring.appendChild(bar);
  }

  var states = {
    escuchando: { text: 'Listening', prompt: '"Contame — ¿cómo te fue en tu primer día?"' },
    pensando:   { text: 'Thinking', prompt: '…' },
    hablando:   { text: 'Speaking', prompt: '"Qué bueno que pudiste presentarte — contame algo más del equipo."' }
  };
  var aura = document.getElementById('aura');
  var stateText = document.getElementById('state-text');
  var promptLine = document.getElementById('prompt-line');
  document.querySelectorAll('[data-state-btn]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-state-btn]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var s = btn.getAttribute('data-state-btn');
      aura.setAttribute('data-state', s);
      stateText.textContent = states[s].text;
      promptLine.innerHTML = states[s].prompt + '<span class="caret"></span>';
    });
  });
  var themeBtn = document.getElementById('theme-toggle');
  themeBtn.addEventListener('click', function () {
    var root = document.documentElement;
    var isLight = root.getAttribute('data-theme') === 'light';
    root.setAttribute('data-theme', isLight ? 'dark' : 'light');
    themeBtn.textContent = 'Tema: ' + (isLight ? 'oscuro' : 'claro');
  });
</script>
</body>
</html>
